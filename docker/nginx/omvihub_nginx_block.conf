# ==============================================================================
# Nginx Configuration for Mfdfs (Satellite Flood Damage Analysis)
# Add this block to your existing: /opt/services/omvi_blog/nginx/default.conf
# ==============================================================================

upstream mfdfs_app {
    # In Docker, 127.0.0.1 refers to the Nginx container itself!
    # To reach the host from inside a container, use your host private IP (172.26.1.124) or the docker gateway (172.17.0.1):
    server 172.26.1.124:8001;
}

# HTTP: Redirect to HTTPS
server {
    listen 80;
    server_name flood.omvihub.in; # Change to your preferred subdomain

    return 301 https://$host$request_uri;
}

# HTTPS: Secure SSL Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name flood.omvihub.in; # Change to your preferred subdomain

    ssl_certificate /etc/letsencrypt/live/flood.omvihub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flood.omvihub.in/privkey.pem;

    # Allow up to 100MB for large GeoJSON AOI uploads and satellite products
    client_max_body_size 100M;

    # Timeouts tailored for satellite downloading & Gemini AI generation
    proxy_connect_timeout 120s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    location / {
        proxy_pass http://mfdfs_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Stream support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
